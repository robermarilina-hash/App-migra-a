/* Versión papel plegado — tema configurable */

:root{--paper:#fbf7f0;--ink:#123c4b;--accent:#285e70;--light:#b8d5df;--medium:#78abc1;--dark:#285e70;--unknown:#e9e2d8;--fold:#829da3;--fold2:#d9c5ab;--edge:#e9e0d5;font-family:Lato,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--paper)}
:root[data-theme="cerezo"]{--ink:#563746;--accent:#a56e80;--light:#efd0d6;--medium:#d89ba9;--dark:#a15c73;--fold:#b68c9b;--fold2:#dfc5bb}

:root[data-theme="bruma"]{--ink:#344957;--accent:#607e92;--light:#d5e1e8;--medium:#a2bfcd;--dark:#5c7f95;--fold:#93adbd;--fold2:#d4cbbd}
:root[data-theme="ambar"]{--ink:#563f32;--accent:#aa7559;--light:#f2d7c3;--medium:#dca889;--dark:#a86a4e;--fold:#c99d82;--fold2:#e5d0b2}
body{background:var(--paper);color:var(--ink)}main{padding:18px 18px 118px;position:relative;min-height:100vh;overflow:hidden}main:after{content:'';pointer-events:none;display:block;position:relative;height:62px;margin:18px -18px -118px;background:linear-gradient(155deg,transparent 33%,var(--fold) 34%,var(--fold) 58%,transparent 59%),linear-gradient(25deg,transparent 25%,var(--fold2) 26%,var(--fold2) 68%,transparent 69%);opacity:.64}
h1,h2,.sectiontitle{font-family:Merriweather,Georgia,serif;letter-spacing:-.025em}h1{font-size:35px;font-weight:700}.muted,.warn{color:#79736d}.hero{height:135px;position:relative;isolation:isolate;margin:0 0 7px;overflow:hidden}.hero .muted{letter-spacing:.16em;font-size:11px;font-weight:900;margin-top:17px;color:var(--ink)}.hero h1{margin:5px 0 0}.hero-rule{width:48px;height:4px;border-radius:8px;background:var(--accent);margin-top:10px}.origami{position:absolute;right:-18px;top:0;width:56%;height:120px;z-index:-1}.origami i{position:absolute;display:block;clip-path:polygon(0 0,100% 0,80% 100%);filter:drop-shadow(0 3px 3px #463b3320)}.origami i:nth-child(1){width:100%;height:95px;background:var(--fold);right:0;top:0;transform:rotate(6deg)}.origami i:nth-child(2){width:95%;height:88px;background:var(--fold2);right:-14px;top:29px;transform:rotate(-15deg)}.origami i:nth-child(3){width:70%;height:45px;background:#eee2d2;right:15px;top:56px;transform:rotate(16deg)}
.card{background:#fffaf4;border:1px solid var(--edge);box-shadow:0 3px 14px #5647380a}.calendar-card{padding:12px 8px 16px;background:transparent;border:0;box-shadow:none;margin:0 0 6px}.calendar{gap:5px}.calendar button{background:#f3eee7;color:var(--ink);border-radius:9px;font-weight:600;font-size:15px}.calendar .l{background:var(--light)}.calendar .m{background:var(--medium)}.calendar .h{background:var(--dark);color:white}.calendar .u{background:var(--unknown)}.calendar .u:after{content:none}.calendar .has-episode:after{content:'';position:absolute;bottom:3px;left:calc(50% - 2.5px);width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.9}.calendar .selected{outline:2px solid var(--accent);outline-offset:1px}.calendar .today{box-shadow:inset 0 0 0 1px var(--accent)}.calendar .weekday{color:var(--ink);font-weight:700}.legend{gap:9px;justify-content:space-between;color:var(--ink);font-size:11px}.dot{border-radius:50%;vertical-align:middle}.primary{background:var(--accent);border-radius:25px;font-weight:700}.register-btn{margin:10px auto;display:block;max-width:390px}.outline{border-color:var(--edge);color:var(--accent);background:#fffaf5}.smallbtn{background:#f4ebe0;color:var(--ink);border-radius:50%;min-width:36px;min-height:36px}.nav{background:#fffaf4;border-top:1px solid var(--edge);border-radius:25px 25px 0 0}.nav button{color:var(--ink);padding:8px 18px}.nav .active{color:var(--accent);background:#eaece7;border-radius:18px}.metric{background:#f4eee7}.metric strong{color:var(--accent)}.pill{background:#eee9e0;color:var(--accent)}.track{background:#e9e1d7}.sheet{background:var(--paper)}.modal{background:#182a3480}.chip.on{background:var(--light);border-color:var(--medium)}input,select,textarea{background:#fffcf8;border-color:var(--edge);color:var(--ink)}.link{color:var(--accent)}.meditem{background:#fffaf4;border-color:var(--edge)}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.theme-choice{border:1px solid var(--edge);border-radius:14px;background:#fffaf4;padding:8px;text-align:left;color:var(--ink)}.theme-choice.chosen-theme{outline:2px solid var(--accent)}.theme-art{height:64px;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(155deg,var(--t1) 0 42%,transparent 43%),linear-gradient(25deg,var(--t2) 0 50%,#f3e6d4 51%);margin-bottom:7px}.theme-motif{position:absolute;width:75px;height:60px;right:7px;top:1px;filter:drop-shadow(2px 3px 2px #453b3335)}.theme-choice strong{font-size:13px}.theme-choice small{display:block;color:#817b75;margin-top:3px}
